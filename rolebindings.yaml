apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: production
roleRef:
  kind: Role
  name: developer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trainee-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: trainee
    namespace: production
roleRef:
  kind: Role
  name: trainee-role
  apiGroup: rbac.authorization.k8s.io
